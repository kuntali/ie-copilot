name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/multi-agent-deliberation-mvp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Generate lockfile
        run: uv lock
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
      - name: Commit lockfile
        run: |
          if git ls-files --error-unmatch uv.lock >/dev/null 2>&1 && git diff --quiet -- uv.lock; then
            echo "uv.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: add uv lockfile"
          git push

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Ruff
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: Tests
        run: uv run --python ${{ matrix.python-version }} pytest
