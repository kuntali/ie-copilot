name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Check lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Ruff
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: Unit tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/unit -m unit
