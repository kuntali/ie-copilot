[project]
name = "ie-copilot"
version = "0.1.0"
description = "Evidence-grounded multi-agent deliberation with LangGraph and Phoenix observability"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "pydantic>=2.8,<3",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "arize-phoenix-otel>=0.14,<1",
  "openinference-instrumentation-langchain>=0.1.50,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
ie-copilot = "ie_copilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ie_copilot"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
